# =============================================================
#  Windows で GPU 描画を使うための追加設定 (試験的)
#  docker-compose.windows.yml に重ねて使う: start.ps1 -Gpu
#
#  WSL2 の GPU (/dev/dxg) と D3D12 ドライバ (/usr/lib/wsl) をコンテナに渡し、
#  Mesa の d3d12 ドライバで OpenGL を GPU 実行する。
#  GPU が複数ある PC では MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA などを environment に追加すると選べる。
#  D3D12 は OpenGL 4.2 までしか名乗らないため、Gazebo のカメラ / LiDAR (Ogre2) が 4.3 の機能を使うと
#  UnimplementedException (GL3PlusTextureGpu::copyTo) で落ちる。MESA_GL_VERSION_OVERRIDE=4.3 で回避する
#  (同じ設定を WSL2 の Ubuntu 用 docker-compose.wsl.yml で動作確認済み)。
#  それでもうまく動かない (画面が黒い・Gazebo が落ちる) ときは -Gpu なし (CPU 描画) で使う。
# =============================================================
services:
  ros2:
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl
    environment:
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - GALLIUM_DRIVER=d3d12
      - MESA_GL_VERSION_OVERRIDE=4.3
