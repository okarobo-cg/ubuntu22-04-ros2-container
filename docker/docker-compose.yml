# =============================================================
#  diffbot_sim 用 docker compose 設定
#
#  このファイルはリポジトリの docker/ にある。リポジトリ全体を /ros2_ws/src/ubuntu22-04-ros2-container にマウントする。
#
#  通常は start.sh / shell.sh / stop.sh から使う。直接使う場合 (ホストで, このディレクトリに移動して):
#    xhost +local:            # GUI 表示を許可 (ホスト再起動ごとに 1 回)
#    docker compose build     # イメージ作成 (初回のみ / Dockerfile 変更時)
#    docker compose up -d     # コンテナ起動 (バックグラウンド)
#    docker compose exec ros2 bash   # コンテナに入る (端末を増やすときも同じ)
#    docker compose down      # コンテナ停止・削除
#  ※ start.sh を使わない場合、UID/GID は既定の 1000 になる (DOCKER_GUIDE 5 章)
#
#  WSL2 の Ubuntu では docker-compose.wsl.yml を重ねて使う (start.sh が /dev/dxg を見て自動で判定):
#    docker compose -f docker-compose.yml -f docker-compose.wsl.yml up -d
# =============================================================
services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: diffbot_sim:humble
    container_name: ubuntu_22_04_ros2
    network_mode: host      # ROS 2 の通信をホストと共有
    ipc: host               # 共有メモリ (DDS / GUI の安定化)
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw   # GUI (X11)
      - ..:/ros2_ws/src/ubuntu22-04-ros2-container
    # GPU (Intel / AMD) を使って描画を高速化する。
    # /dev/dri が無い PC ではこの 2 行をコメントアウトする (CPU 描画になるが動作はする)。
    # WSL2 では docker-compose.wsl.yml が /dev/dxg に差し替える。
    devices:
      - /dev/dri:/dev/dri
    # /dev/dri を一般ユーザで使うためのグループ (start.sh がホストの GID を渡す)
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-109}"
    command: bash
